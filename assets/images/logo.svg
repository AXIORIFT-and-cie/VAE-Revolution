<svg width="1400" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350">
  <defs>
    <linearGradient id="blueLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5a9fb8;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#4db8d8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3dd4f4;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#4db8d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a9fb8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- AXIORIFT text with outline style matching the image -->
  <text x="700" y="180"
        font-family="'Arial', sans-serif"
        font-size="140"
        font-weight="300"
        fill="none"
        stroke="#d0d0d0"
        stroke-width="3"
        text-anchor="middle"
        letter-spacing="18">AXIORIFT</text>

  <!-- Blue gradient line underneath -->
  <rect x="280" y="235" width="840" height="12"
        fill="url(#blueLineGradient)"/>

  <!-- Left end cap -->
  <rect x="255" y="232" width="30" height="18"
        fill="url(#blueLineGradient)"/>

  <!-- Right end cap -->
  <rect x="1115" y="232" width="30" height="18"
        fill="url(#blueLineGradient)"/>
</svg>
