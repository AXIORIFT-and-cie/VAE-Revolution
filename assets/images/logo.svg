<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f3ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- AXIORIFT text -->
  <text x="400" y="110" font-family="Orbitron, monospace" font-size="80" font-weight="300"
        fill="none" stroke="#00f3ff" stroke-width="2"
        text-anchor="middle" letter-spacing="8" filter="url(#glow)">AXIORIFT</text>

  <!-- Blue line underneath -->
  <line x1="50" y1="150" x2="750" y2="150" stroke="url(#blueGradient)" stroke-width="6"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Small accents at the ends of the line -->
  <rect x="40" y="145" width="20" height="10" fill="url(#blueGradient)" filter="url(#glow)"/>
  <rect x="740" y="145" width="20" height="10" fill="url(#blueGradient)" filter="url(#glow)"/>
</svg>
