<svg width="1400" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350">
  <defs>
    <!-- Gradient de l'image de gauche: bleu-teal foncé → cyan brillant → bleu-teal foncé -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#306A7A;stop-opacity:1" />
      <stop offset="10%" style="stop-color:#3D7E8E;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4A96AC;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#18C8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00E0FF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#18C8E8;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4A96AC;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#3D7E8E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#306A7A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- AXIORIFT avec outline très fin comme l'image de gauche -->
  <text x="700" y="175"
        font-family="Arial, Helvetica, sans-serif"
        font-size="138"
        font-weight="200"
        fill="none"
        stroke="#CBCBCB"
        stroke-width="2"
        text-anchor="middle"
        letter-spacing="22">AXIORIFT</text>

  <!-- Ligne bleue gradient -->
  <rect x="278" y="236" width="844" height="9"
        fill="url(#lineGradient)"/>

  <!-- Accent rectangulaire gauche -->
  <rect x="252" y="233" width="32" height="15"
        fill="url(#lineGradient)"/>

  <!-- Accent rectangulaire droit -->
  <rect x="1116" y="233" width="32" height="15"
        fill="url(#lineGradient)"/>
</svg>
